<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Setu: your money bridge from India to the UK</title>
<meta name="description" content="A free, private money planner for Indians moving to the UK: monthly budget, first-90-days checklist, and goals back home.">
<meta name="theme-color" content="#4B3BE0">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4F2FB;--card:#FFFFFF;--ink:#1A1446;--soft:#6D6992;--rule:#E8E4F4;
  --indigo:#4B3BE0;--indigo-2:#3A2CC0;--marigold:#FFB020;--rani:#EE3F86;--teal:#12B5A6;--mint:#1FB98F;--coral:#F2553F;
  --t-indigo:#ECE9FF;--t-rani:#FFE5EF;--t-marigold:#FFF0D2;--t-mint:#DBF6EC;--t-teal:#D9F4F1;
  --india:var(--marigold);--uk:var(--indigo);--sage:var(--mint);--rust:var(--coral);
  --hero:var(--indigo);--hero-ink:#FFFFFF;--hero-soft:#D8D3FF;
  --s-rent:#FF7FB0;--s-bills:#FFD580;--s-day:#7FE3D8;--s-india:#FFB020;--s-left:#FFFFFF;
  --mist:var(--bg);
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F0C24;--card:#1B1740;--ink:#F0EEFF;--soft:#A9A4D2;--rule:#2C2760;--indigo:#7C6DFF;--indigo-2:#5A4BE6;--hero:#3B2DC4;--t-indigo:#2A2466;--t-rani:#3D1B34;--t-marigold:#3A2E14;--t-mint:#143A31;--t-teal:#12363A;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0F0C24;--card:#1B1740;--ink:#F0EEFF;--soft:#A9A4D2;--rule:#2C2760;--indigo:#7C6DFF;--indigo-2:#5A4BE6;--hero:#3B2DC4;--t-indigo:#2A2466;--t-rani:#3D1B34;--t-marigold:#3A2E14;--t-mint:#143A31;--t-teal:#12363A;color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;background:var(--bg);scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--ink);font:400 15px/1.45 Figtree,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
#app{height:100%}
button{font:inherit;color:inherit}
h1,h2,h3,.f,.brand{font-family:"Bricolage Grotesque",Figtree,system-ui,sans-serif;font-variant-numeric:tabular-nums;letter-spacing:-.015em}
h1,h2,h3{margin:0;font-weight:800}
h3{font-size:17px}
.soft{color:var(--soft)}.small{font-size:12.5px}
.ok{color:var(--mint)}.bad{color:var(--coral)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid var(--indigo);outline-offset:2px}
.row-b{display:flex;justify-content:space-between;align-items:center;gap:10px}
.grow{min-width:0;flex:1}
.chev{color:var(--soft);font-size:22px;line-height:1}

/* shell */
.app{height:100%;display:flex}
.col{flex:1;min-width:0;display:flex;flex-direction:column;height:100%;max-width:560px;margin:0 auto}
.side{display:none}
.mhd{display:flex;align-items:center;gap:10px;padding:10px 16px 8px;min-height:58px}
.ava{width:38px;height:38px;border-radius:14px;background:var(--marigold);color:#3B2600;display:grid;place-items:center;font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:18px;flex-shrink:0}
.hi{flex:1;min-width:0}.hi b{display:block;font-family:"Bricolage Grotesque",sans-serif;font-size:19px;font-weight:800;line-height:1.1}.hi span{font-size:12.5px;color:var(--soft)}
.ptitle{font-size:24px;flex:1}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:21px}
.brand svg{width:30px;height:30px;flex-shrink:0;color:var(--ink)}
.gear{border:0;background:var(--card);width:40px;height:40px;border-radius:14px;color:var(--ink);cursor:pointer;display:grid;place-items:center;box-shadow:0 1px 0 var(--rule)}
.gear svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.8}
main{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:2px 14px 16px;display:flex;flex-direction:column;gap:12px}
main>*{flex-shrink:0}
.phd{display:none}
.tabbar{display:flex;margin:0 10px 8px;background:var(--card);border-radius:22px;padding:6px;box-shadow:0 8px 24px -12px rgba(40,24,140,.35);border:1px solid var(--rule)}
.tb{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;border:0;background:none;color:var(--soft);font-weight:700;font-size:11px;padding:6px 0 5px;border-radius:16px;cursor:pointer;transition:background-color .2s ease,color .2s ease}
.tb svg,.sn svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tb[aria-selected="true"]{background:var(--t-indigo);color:var(--indigo)}

/* cards */
.card{background:var(--card);border-radius:22px;padding:14px 16px;border:1px solid var(--rule)}
.hero{background:var(--hero);color:var(--hero-ink);border-radius:26px;padding:16px 18px 14px;position:relative;overflow:hidden;box-shadow:0 14px 30px -16px rgba(60,40,220,.65)}
.hero .lbl{font-size:13.5px;color:var(--hero-soft);font-weight:600}
.hero .big{font-size:clamp(42px,12vw,52px);font-weight:800;line-height:1;letter-spacing:-.035em;margin:4px 0 2px}
.hero .sub{font-size:12.5px;color:var(--hero-soft)}
.hero .jar{position:absolute;right:10px;top:8px;width:78px;height:78px}
.flow{display:flex;gap:3px;height:10px;margin:12px 0 8px}
.flow div{border-radius:5px;transition:width .8s cubic-bezier(.2,.8,.2,1)}
.key{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px;font-size:11px;color:var(--hero-soft)}
.key span{display:flex;flex-direction:column;min-width:0}
.key span::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c);margin-bottom:3px}
.key b{color:#fff;font-weight:800;font-size:13px;font-family:"Bricolage Grotesque",sans-serif}

/* insights */
.nudges{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;margin:0 -14px;padding:2px 14px 4px}
.nudges::-webkit-scrollbar{display:none}
.nudge{scroll-snap-align:start;flex:0 0 78%;max-width:290px;display:flex;gap:11px;align-items:flex-start;text-align:left;border:0;border-radius:20px;padding:12px 14px;background:var(--tint);cursor:pointer;transition:transform .15s ease}
.nudge .ic{width:36px;height:36px;border-radius:12px;background:var(--tone);display:grid;place-items:center;flex-shrink:0;color:#fff}
.nudge .ic svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.nudge b{display:block;font-size:14.5px;font-weight:800;font-family:"Bricolage Grotesque",sans-serif;line-height:1.2;margin-bottom:3px}
.nudge .grow{display:block}.nudge .grow>span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:12.5px;color:var(--soft);line-height:1.35}
.nudge em{display:block;font-style:normal;font-weight:800;font-size:12.5px;color:var(--tone);margin-top:3px}

/* plan */
.step{display:flex;align-items:center;gap:12px;width:100%;border:0;border-top:1px solid var(--rule);background:none;padding:10px 0;text-align:left;cursor:pointer;border-radius:0}
.ch+.step,.ph3+.step{border-top:0}
.ph3{margin-bottom:4px}
.num{width:30px;height:30px;border-radius:11px;display:grid;place-items:center;font-weight:800;font-size:14px;color:#fff;flex-shrink:0;font-family:"Bricolage Grotesque",sans-serif}
.st{display:block;font-weight:700;font-size:15px}
.sd{display:block;font-size:12.5px;color:var(--soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.amt{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:18px;flex-shrink:0}
.fine{font-size:11.5px;color:var(--soft);margin:6px 0 0}
.glance{display:none}

/* checklist */
.journey{display:flex;gap:12px;align-items:center;background:var(--t-marigold);border-color:transparent}
.journey svg{width:118px;height:62px;flex-shrink:0}
.big2{font-size:32px;font-weight:800;line-height:1.05;white-space:nowrap}.big2 small{font-size:16px;font-weight:700;margin-left:4px}
.phases{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -14px;padding:0 14px}.phases::-webkit-scrollbar{display:none}
.ph{flex-shrink:0;border:0;background:var(--card);padding:8px 13px;border-radius:999px;font-weight:700;font-size:13px;cursor:pointer;display:flex;gap:6px;align-items:center;box-shadow:inset 0 0 0 1px var(--rule)}
.ph small{font-weight:600;color:var(--soft);font-size:11.5px}
.ph[aria-pressed="true"]{background:var(--ink);color:var(--card);box-shadow:none}
.ph[aria-pressed="true"] small{color:var(--card);opacity:.75}
.ph.full small{color:var(--mint)}
.item{display:flex;align-items:center;gap:12px;border-top:1px solid var(--rule);padding:9px 0}
.item:first-of-type{border-top:0}
.tick{width:28px;height:28px;border-radius:10px;border:2px solid var(--rule);background:none;display:grid;place-items:center;cursor:pointer;flex-shrink:0;color:#fff;transition:background-color .15s ease,border-color .15s ease}
.tick svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round;opacity:0}
.tick[aria-checked="true"]{background:var(--mint);border-color:var(--mint)}
.tick[aria-checked="true"] svg{opacity:1}
.it{border:0;background:none;text-align:left;padding:0;cursor:pointer;min-width:0;flex:1}
.it b{display:block;font-weight:700;font-size:14.5px}
.it span{display:block;font-size:12px;color:var(--soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.done b{color:var(--soft);text-decoration:line-through;text-decoration-color:var(--rule)}
.tag{font-style:normal;font-size:10.5px;font-weight:800;padding:2px 7px;border-radius:7px;margin-left:4px;vertical-align:2px}
.tag.in{background:var(--t-marigold);color:#A0650A}.tag.uk{background:var(--t-indigo);color:var(--indigo)}.tag.both{background:var(--t-teal);color:#0B7C72}
.done .tag{opacity:.55}
.alldone{display:flex;gap:12px;align-items:center}.alldone svg{width:72px;height:60px;flex-shrink:0}

/* spending */
.mhead{display:flex;justify-content:space-between;align-items:center;margin:-8px -8px 0}
.navb{border:0;background:none;width:38px;height:34px;font-size:24px;color:var(--soft);cursor:pointer;border-radius:12px}
.navb[disabled]{opacity:.3;cursor:default}
.ringrow{display:flex;align-items:center;gap:14px}
.ring{width:74px;height:74px;flex-shrink:0;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:10}
.ring .rv{transition:stroke-dashoffset .9s cubic-bezier(.2,.8,.2,1)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:17px}
.mid{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:28px;line-height:1.05}
.leftchip{display:inline-block;margin-top:6px;padding:4px 10px;border-radius:999px;font-weight:700;font-size:12.5px;background:var(--t-mint);color:#0D7A5E}
.leftchip.over{background:var(--t-rani);color:#B21E5F}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -16px 10px;padding:0 16px}.chips::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;display:flex;align-items:center;gap:6px;border:0;background:var(--bg);font-weight:700;font-size:13px;padding:7px 12px 7px 8px;border-radius:999px;cursor:pointer}
.chip i{width:22px;height:22px;border-radius:8px;background:var(--cc);display:grid;place-items:center;color:#fff}
.chip i svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--card)}
.inrow{display:flex;gap:8px}.inrow input{flex:1;min-width:0}.inrow .a{flex:0 0 30%}
input,select,textarea{font:600 16px Figtree,system-ui,sans-serif;padding:11px 13px;border:2px solid transparent;border-radius:14px;background:var(--bg);color:var(--ink);width:100%;transition:border-color .15s ease}
input:focus,select:focus,textarea:focus{border-color:var(--indigo);outline:none}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
input[type=number]{-moz-appearance:textfield;appearance:textfield}
.undo{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:8px;font-size:12.5px;color:var(--soft)}
.undo span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.tile{border:0;background:var(--card);border-radius:16px;padding:9px 10px 8px;text-align:left;cursor:pointer;box-shadow:inset 0 0 0 1px var(--rule);min-width:0}
.tile .row-b{font-size:12.5px;font-weight:700;gap:4px}.tile .row-b>span{display:flex;align-items:center;gap:7px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile i{width:22px;height:22px;border-radius:8px;background:var(--cc);display:grid;place-items:center;color:#fff;flex-shrink:0}
.tile i svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.tile .v{font-size:11.5px;color:var(--soft);flex-shrink:0;overflow:visible}.tile .v b{color:var(--ink);font-family:"Bricolage Grotesque",sans-serif;font-size:14px}
.bar{height:8px;border-radius:4px;background:var(--rule);overflow:hidden;margin:6px 0 1px}
.bar div{height:100%;border-radius:4px;background:var(--cc,var(--indigo));transition:width .8s cubic-bezier(.2,.8,.2,1)}
.bar.over div{background:var(--coral)}
.emptyline{display:flex;gap:10px;align-items:center;font-size:12.5px;color:var(--soft);grid-column:1/-1;padding:2px 2px 0}.emptyline svg{width:40px;height:40px;flex-shrink:0}

/* goals */
.goal{position:relative;overflow:hidden}
.goal .ill{position:absolute;right:10px;top:8px;width:74px;height:66px}
.goal h3{padding-right:78px}
.goal .kick{font-size:12.5px;color:var(--soft);margin-top:10px}
.goal .mid{margin-top:2px}
.gp{font-size:14px;margin:8px 0 0;line-height:1.45}

/* buttons */
.btn{border:0;background:var(--card);color:var(--ink);font-weight:800;font-size:14.5px;padding:13px 18px;border-radius:999px;cursor:pointer;white-space:nowrap;box-shadow:inset 0 0 0 1.5px var(--rule);transition:transform .1s ease,filter .15s ease}
.btn.go{background:var(--indigo);color:#fff;box-shadow:0 10px 20px -12px rgba(75,59,224,.9)}
.btn.warn{color:var(--coral)}
.btn[disabled]{opacity:.45;cursor:default;box-shadow:none}
.btn:active:not([disabled]),.nudge:active,.tile:active,.chip:active,.tb:active{transform:scale(.96)}
.link{border:0;background:none;padding:6px 0;color:var(--indigo);font-weight:800;font-size:13.5px;cursor:pointer}
.link.bad{color:var(--coral)}
.acts{display:flex;gap:8px}.acts .btn{flex:1}

/* wizard */
.wzshell{height:100%;display:flex;justify-content:center;overflow-y:auto}
.wzcard{width:100%;max-width:520px;padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column}
.wz{display:flex;flex-direction:column;flex:1;gap:14px}
.wz .top{display:flex;align-items:center;gap:10px}
.dots{display:flex;gap:6px;flex:1}.dots i{height:6px;flex:1;border-radius:3px;background:var(--rule);transition:background-color .3s ease}.dots i.on{background:var(--indigo)}
.wz h1{font-size:30px;line-height:1.1}
.wz .lead{color:var(--soft);margin:6px 0 0}
.field{display:block}.field>span{display:block;font-size:13px;color:var(--soft);margin-bottom:5px;font-weight:600}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:end}
.fields{display:flex;flex-direction:column;gap:12px}
.hintline{display:inline-block;font-size:13px;color:#0D7A5E;background:var(--t-mint);font-weight:700;margin-top:8px;padding:4px 10px;border-radius:999px}
.hintline:empty{display:none}
.hintline.owe{color:#B21E5F;background:var(--t-rani)}
.fields>.hintline{align-self:flex-start}
.adorn{position:relative;display:block}
.adorn i{position:absolute;top:50%;transform:translateY(-50%);left:13px;font-style:normal;color:var(--soft);font-weight:700;pointer-events:none}
.adorn input{padding-left:30px}.adorn.suf i{left:auto;right:13px}.adorn.suf input{padding-left:13px;padding-right:30px}
.seg{display:flex;background:var(--bg);border-radius:14px;padding:4px}
.seg button{flex:1;border:0;background:none;padding:9px 4px;border-radius:11px;font-weight:700;font-size:13.5px;color:var(--soft);cursor:pointer;transition:background-color .2s ease,color .2s ease}
.seg [aria-checked="true"]{background:var(--card);color:var(--indigo);box-shadow:0 2px 8px -4px rgba(40,24,140,.4)}
.wz .foot{margin-top:auto;display:flex;gap:8px}.wz .foot .btn{flex:1}
.foot.col2{flex-direction:column;align-items:stretch;gap:4px}.foot.col2 .link{align-self:center}
.x{border:0;background:var(--bg);font-size:24px;line-height:1;color:var(--ink);width:38px;height:38px;border-radius:12px;cursor:pointer}
.introhero{background:var(--hero);border-radius:28px;padding:10px 12px 20px;color:#fff;box-shadow:0 18px 34px -18px rgba(60,40,220,.7)}
.introhero svg{width:100%;height:auto;display:block}
.introhero h1{font-size:30px;line-height:1.08;color:#fff;padding:0 8px}
.promise{display:flex;flex-direction:column;gap:10px;margin:0;padding:0;list-style:none}
.promise li{display:flex;gap:12px;align-items:center;font-weight:600}
.promise li i{width:32px;height:32px;border-radius:11px;background:var(--c);display:grid;place-items:center;color:#fff;flex-shrink:0}
.promise li i svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.private{font-size:13px;color:var(--soft);margin:0}

.tip{position:relative;display:inline-flex;vertical-align:1px;margin-left:5px}
.tipb{width:17px;height:17px;border-radius:50%;border:0;padding:0;background:var(--t-indigo);color:var(--indigo);font:800 11px/17px Figtree,system-ui,sans-serif;font-style:italic;cursor:help}
.tipt{position:absolute;bottom:calc(100% + 8px);left:50%;transform:translate(-50%,4px);background:var(--ink);color:var(--card);font-size:12.5px;font-weight:600;line-height:1.35;padding:8px 11px;border-radius:11px;width:max-content;max-width:210px;opacity:0;visibility:hidden;pointer-events:none;transition:opacity .15s ease,transform .15s ease,visibility .15s;z-index:10;box-shadow:0 8px 20px -10px rgba(20,12,60,.6)}
.tipt::after{content:"";position:absolute;top:100%;left:50%;margin-left:-5px;border:5px solid transparent;border-top-color:var(--ink)}
.tip.r .tipt{left:auto;right:-8px;transform:translateY(4px)}.tip.r .tipt::after{left:auto;right:12px}
.tip:hover .tipt,.tipb:focus+.tipt{opacity:1;visibility:visible;transform:translate(-50%,0)}
.tip.r:hover .tipt,.tip.r .tipb:focus+.tipt{transform:none}
@media (max-width:879px){.wz input,.wz select{background:var(--card);box-shadow:inset 0 0 0 1.5px var(--rule)}.wz input:focus{box-shadow:none}.wz .seg{background:var(--card);box-shadow:inset 0 0 0 1.5px var(--rule)}.wz .seg [aria-checked="true"]{background:var(--t-indigo);box-shadow:none}}
.ratebox{display:flex;flex-direction:column;gap:2px;background:var(--t-indigo);border-radius:14px;padding:10px 13px}.ratebox span{font-size:12.5px;color:var(--soft);font-weight:600}.ratebox b{font-family:"Bricolage Grotesque",sans-serif;font-size:17px}.ratebox small{font-size:12px;color:var(--soft)}
.debts{display:flex;flex-direction:column;gap:8px}
.debt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;border-radius:18px;padding:11px 14px;background:var(--card);box-shadow:inset 0 0 0 1.5px var(--rule);cursor:pointer;transition:transform .1s ease,box-shadow .15s ease}
.debt i{width:36px;height:36px;border-radius:12px;background:var(--dc);display:grid;place-items:center;color:#fff;flex-shrink:0}
.debt i svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ---------- helpers ---------- */
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function sum(a){return a.reduce(function(x,y){return x+(+y||0);},0);}
function gbp(n){return (n<0?'−':'')+'£'+Math.round(Math.abs(n)).toLocaleString('en-GB');}
function gbp2(n){return '£'+(+n||0).toLocaleString('en-GB',{minimumFractionDigits:2,maximumFractionDigits:2});}
function inr(n){var a=Math.abs(n),s=n<0?'−':'';if(a>=1e7)return s+'₹'+(a/1e7).toFixed(2)+' Cr';if(a>=1e5)return s+'₹'+(a/1e5).toFixed(1)+' L';return s+'₹'+Math.round(a).toLocaleString('en-IN');}
function pct(a,b){return b>0?Math.max(0,Math.min(100,a/b*100)):0;}
function uid(){return 'x'+Math.random().toString(36).slice(2,9);}
function today(){return new Date().toISOString().slice(0,10);}
function mKey(d){d=d||new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');}
function mLabel(k){var p=k.split('-');return new Date(+p[0],+p[1]-1,1).toLocaleString('en-GB',{month:'long',year:'numeric'});}
function addDays(iso,n){var d=new Date(iso+'T12:00');d.setDate(d.getDate()+n);return d;}
function dLabel(d){return d.toLocaleDateString('en-GB',{day:'numeric',month:'short'});}
function daysSince(iso){return Math.floor((Date.now()-new Date(iso+'T00:00').getTime())/864e5);}

/* UK take-home, England/Wales/NI rates for 2026/27 (thresholds frozen) */
function penPctOf(v){return (v===''||v==null)?5:(+v||0);}
function takeHome(g,penPct){penPct=penPctOf(penPct);
  g=+g||0;var pa=12570;if(g>100000)pa=Math.max(0,12570-(g-100000)/2);
  var pen=Math.max(0,Math.min(g,50270)-6240)*(+penPct||0)/100;
  var ti=Math.max(0,g-pen-pa);
  var tax=0.2*Math.min(ti,37700)+0.4*Math.max(0,Math.min(ti,125140)-37700)+0.45*Math.max(0,ti-125140);
  var ni=0.08*Math.max(0,Math.min(g,50270)-12570)+0.02*Math.max(0,g-50270);
  return {month:(g-tax-ni-pen)/12,tax:tax/12,ni:ni/12,pen:pen/12};
}

/* ---------- money model ---------- */
function moneyIn(k){var x=(S.months||{})[k]||{};return {salary:+x.salary||0,carry:+x.carry||0};}
function month(){
  var p=S.profile,th=takeHome(p.salary,p.pension),mi=moneyIn(mKey());if(mi.salary>0)th=Object.assign({},th,{month:mi.salary,actual:true});var india=indiaMonthly(p)/(+p.fx||129);
  var parts=[['Rent',+p.rent||0,'--s-rent'],['Bills',+p.bills||0,'--s-bills'],['Personal',+p.everyday||0,'--s-day'],['India',india,'--s-india']];
  var left=th.month-sum(parts.map(function(x){return x[1];}));
  return {carry:mi.carry,th:th,india:india,parts:parts,left:left,ukCosts:(+p.rent||0)+(+p.bills||0)+(+p.everyday||0)};
}
function homeCalc(){
  var p=S.profile,yrs=Math.max(0,(+p.homeYear||0)-new Date().getFullYear());
  var cost=(+p.homeCost||0)*Math.pow(1.06,yrs),mr=Math.pow(1+(+p.homeRet||8)/100,1/12)-1,n=yrs*12,saved=+p.homeSaved||0;
  var fv=saved*Math.pow(1+mr,n),gap=Math.max(0,cost-fv),need=n?gap/((Math.pow(1+mr,n)-1)/mr):gap;
  return {yrs:yrs,cost:cost,fv:fv,need:need};
}
function split(){
  var p=S.profile,m=month(),fx=+p.fx||129,L=Math.max(0,m.left+(m.carry||0)),out=[];
  function add(a,title,where,why,col){a=Math.max(0,Math.min(L,Math.round(a)));if(a<5)return;out.push({amt:a,title:title,where:where,why:why,col:col});L-=a;}
  var efT=m.ukCosts*(+p.efMonths||4),have=+p.savedUK||0,gap=Math.max(0,efT-have);
  if(gap>0)add(Math.min(gap,L*(have<m.ukCosts?0.6:0.4)),'Emergency savings','A UK savings account you can take money out of any time','Your goal is '+gbp(efT)+', which covers '+(p.efMonths||4)+' months of UK costs. You have '+gbp(have)+' so far. On a work visa, losing your job can be stressful, so this safety net comes first.','var(--uk)');
  if((+p.cardBal||0)>0)add(Math.min(p.cardBal/fx,L*0.5),'Clear the credit card','Pay much more than the minimum each month','Indian credit cards can charge 36–45% interest a year. Paying it off saves more than any investment would earn.','var(--rust)');
  if((+p.plBal||0)>0)add(Math.min(p.plBal/fx,L*0.35),'Pay down personal loans','Save up, then pay them off early when allowed','Personal and unsecured loans usually cost 11–16% interest a year, often more. That is more than safe savings earn, so paying early saves you money.','#C8266C');
  if(p.homeOn&&(+p.homeCost||0)>0){var h=homeCalc();if(h.need>0)add(Math.min(h.need/fx,L*0.5),'Home in India','Safe options like fixed deposits, through your NRE account','Saving about '+gbp(h.need/fx)+' a month gets you to '+inr(h.cost)+' by '+p.homeYear+'. Money you need in a few years is safer away from the share market.','var(--india)');}
  add(L,'Long-term investing','Your work pension first, then an ISA','This is money you won’t touch for 10 years or more. Simple, low-cost funds that follow the whole market are a common choice. An ISA keeps it free from UK tax.','var(--sage)');
  return out;
}
function retire(monthlyGBP){
  var p=S.profile,fx=+p.fx||129;monthlyGBP=(+monthlyGBP||0)+(+p.sip||0)/fx;var age=+p.age||30,target=+p.retireAge||50,r=(+p.ret||10)/100,inf=(+p.inf||6)/100,wd=(+p.wd||3.5)/100;
  var mr=Math.pow(1+r,1/12)-1,c=+p.invested||0,k=monthlyGBP*fx,tM=Math.max(0,Math.round((target-age)*12)),atT=c,readyM=null;
  function need(m){return (+p.retireSpend||0)*12*Math.pow(1+inf,m/12)/wd;}
  for(var m=0;m<=720;m++){if(m===tM)atT=c;if(readyM===null&&c>=need(m))readyM=m;if(readyM!==null&&m>=tM)break;c=c*(1+mr)+k;}
  var needT=need(tM),af=tM>0?(Math.pow(1+mr,tM)-1)/mr:1,extra=Math.max(0,needT-atT)/af/fx;
  return {ready:readyM===null?null:age+readyM/12,needT:needT,atT:atT,extra:extra,target:target};
}

function mfMetrics(data){
  var pts=data.map(function(d){var a=d.date.split('-');return [new Date(+a[2],+a[1]-1,+a[0]).getTime(),+d.nav];}).filter(function(x){return x[1]>0;}).sort(function(a,b){return a[0]-b[0];});
  if(pts.length<30)return null;var last=pts[pts.length-1];
  function at(y){var t=last[0]-y*365.25*864e5;if(pts[0][0]>t+20*864e5)return null;var lo=0,hi=pts.length-1;while(lo<hi){var md=(lo+hi+1)>>1;if(pts[md][0]<=t)lo=md;else hi=md-1;}return pts[lo][1];}
  function cagr(y){var v=at(y);return v?(Math.pow(last[1]/v,1/y)-1)*100:null;}
  var from=last[0]-10*365.25*864e5,peak=0,dd=0,ddYear=null;pts.forEach(function(x){if(x[0]<from)return;if(x[1]>peak)peak=x[1];var d=(x[1]/peak-1)*100;if(d<dd){dd=d;ddYear=new Date(x[0]).getFullYear();}});
  var mon=[],lastM=-1;pts.forEach(function(x){var m=new Date(x[0]);var k=m.getFullYear()*12+m.getMonth();if(k!==lastM){mon.push(x[1]);lastM=k;}else mon[mon.length-1]=x[1];});
  var rets=[];for(var i=1;i<mon.length;i++)rets.push(mon[i]/mon[i-1]-1);rets=rets.slice(-60);var mu=rets.reduce(function(a,b){return a+b;},0)/Math.max(1,rets.length);
  var vol=Math.sqrt(rets.reduce(function(a,b){return a+(b-mu)*(b-mu);},0)/Math.max(1,rets.length-1))*Math.sqrt(12)*100;
  return {r1:cagr(1),r3:cagr(3),r5:cagr(5),dd:dd,ddYear:ddYear,vol:vol,since:new Date(pts[0][0]).getFullYear(),spark:mon.slice(-60),asOf:new Date(last[0]).toISOString().slice(0,10)};
}

    var pick=(list||[]).filter(function(x){var n=x.schemeName||'';return /direct/i.test(n)&&/growth/i.test(n)&&!/idcw|dividend|bonus/i.test(n);})[0]||(list||[])[0];

  }).then(function(j){var m=mfMetrics(j.data||[]);if(!m)throw 0;m.at=t;m.src=(j.meta&&j.meta.scheme_name)||'';S.mf[id]=m;save();})

    if(hv){var h=(+d.savedUK||0)*fx+(+d.invested||0);hv.textContent=h>0?'You have about '+inr(h)+' ('+gbp(h/fx)+')':'';}
    var b=document.querySelector('[data-wz="next"]');if(b&&wz.step===2)b.disabled=!(+d.salary>0&&d.rent!=='');}
  document.querySelectorAll('[data-k]').forEach(function(el){el.addEventListener('input',function(){var k=el.dataset.k;wz.d[k]=el.type==='number'?(el.value===''?'':parseFloat(el.value)):el.value;upd();});});
  upd();
}
function wizardAction(a){
  if(a==='next'){wz.step++;render();var f=document.querySelector('.wz input');if(f)f.focus();return;}
  if(a==='back'){wz.step=Math.max(1,wz.step-1);render();return;}
  if(a==='cancel'){wz=null;render();return;}
  if(a==='finish'){var d=wz.d;d.homeOn=String(d.homeOn)==='true';['age','salary','rent','bills','everyday','indiaOther','fx','invested','sip','savedUK','retireAge','retireSpend','homeCost','homeYear','homeSaved'].forEach(function(k){d[k]=d[k]===''?0:+d[k];});d.fx=fxNow();if(!d.moved)d.moved=today();delete d.india;delete d.debt;delete d.debtINR;d.pension=(d.pension===''||d.pension==null)?'':+d.pension;syncDebts(d);
    var first=!S.profile;S.profile=d;wz=null;tab='home';lastTab=null;save();render();toast(first?'Your plan is ready':'Setup saved');if(first)setTimeout(confetti,250);}
}

/* ---------- sheets ---------- */
function formSheet(title,fields,obj,onSave,extra){
  openSheet(function(){return {title:title,body:'<div class="fields">'+fields.map(function(f){var v=obj[f.k];
    return '<label class="field"><span>'+esc(f.label)+'</span>'+(f.options?'<select data-f="'+f.k+'">'+f.options.map(function(o){return '<option value="'+esc(o[0])+'"'+(String(v)===String(o[0])?' selected':'')+'>'+esc(o[1])+'</option>';}).join('')+'</select>':'<input data-f="'+f.k+'" '+(f.text?'type="'+(f.date?'date':'text')+'"':'type="number" inputmode="decimal" step="any"')+' value="'+esc(v)+'">')+'</label>';}).join('')+'</div><div class="acts"><button class="btn go" data-form="save">Save</button>'+(extra?extra:'')+'</div>'};});
  formSave=function(){var o={};fields.forEach(function(f){var el=document.querySelector('[data-f="'+f.k+'"]');o[f.k]=f.text||f.options?el.value:(parseFloat(el.value)||0);});onSave(o);save();closeSheet();};
}
var formSave=null,formDelete=null;
var SHEETS={
  plan:function(i){if(i==='debt'){var L=split().filter(function(x){return x.title==='Clear the credit card'||x.title==='Pay down personal loans';}),fx=+S.profile.fx||129,tot=sum(L.map(function(x){return x.amt;}));return {title:'Pay off expensive debt',body:'<div class="mid f">'+gbp(tot)+' <span class="small soft" style="font-family:Figtree,sans-serif;font-weight:500">a month, about '+inr(tot*fx)+'</span></div>'+L.map(function(x){return '<p class="small soft" style="margin:14px 0 2px">'+esc(x.title)+': '+gbp(x.amt)+' (≈ '+inr(x.amt*fx)+')</p><p style="margin:0 0 4px"><b>'+esc(x.where)+'.</b> '+esc(x.why)+'</p>';}).join('')+'<p class="fine">This is general guidance, not financial advice. For advice on your own situation, talk to a qualified adviser.</p>'};}var x=split()[i];if(!x)return null;return {title:x.title,body:'<div class="mid f">'+gbp(x.amt)+' <span class="small soft" style="font-family:Figtree,sans-serif;font-weight:500">a month, about '+inr(x.amt*(+S.profile.fx||129))+'</span></div><p class="small soft" style="margin:14px 0 2px">Where</p><p>'+esc(x.where)+'</p><p class="small soft" style="margin:6px 0 2px">Why</p><p>'+esc(x.why)+'</p><p class="fine">This is general guidance, not financial advice. For advice on your own situation, talk to a qualified adviser.</p>'};},
  task:function(id){var t=TASKS.find(function(x){return x.id===id;}),on=!!S.checks[id],dd=dueDate(t);return {title:t.title,body:(dd?'<p class="small soft">Try to finish by '+dLabel(dd)+'</p>':'')+'<p>'+esc(t.text)+'</p>'+(t.link?'<a class="official" href="'+t.link+'" target="_blank" rel="noopener">Read the official guidance</a>':'')+'<div class="acts" style="margin-top:16px"><button class="btn '+(on?'':'go')+'" data-tick="'+id+'" data-close-after>'+(on?'Mark as not done':'Mark as done')+'</button></div>'};},
  items:function(){var vm=viewMonth||mKey(),C=cats(),it=S.items.filter(function(x){return x.date.slice(0,7)===vm;}).sort(function(a,b){return a.date<b.date?1:-1;});
    return {title:'Spending in '+mLabel(vm),body:it.length?'<div class="list">'+it.map(function(x){var c=C.find(function(y){return y.k===x.cat;});return '<button class="li" data-item="'+x.id+'"><span class="grow"><b style="display:block;font-weight:600">'+esc(x.note||(c?c.label:'Spending'))+'</b><span class="small soft">'+esc(c?c.label:'')+', '+dLabel(new Date(x.date+'T12:00'))+'</span></span><span class="f" style="font-weight:700">'+gbp2(x.amt)+'</span></button>';}).join('')+'</div><p class="fine">Tap an item to edit or delete it.</p>':'<p class="soft">Nothing logged for '+mLabel(vm)+' yet. Add spending from the Spending tab.</p>'};},
  settings:function(){var p=S.profile;if(!p)return SHEETS.about();return {title:'Settings',body:'<div class="list">'+[['setup','Edit my setup','Pay, rent, loans and savings'],['fx','Rupee rate',fxLabel()+'. Tap to refresh.'],['assume','How we do the maths',p.inf+'% India inflation, '+p.ret+'% growth, '+p.wd+'% withdrawal'],['backup','Back up your data','Move your data to another phone or computer'],['about','About Setu','What Setu is, and what it isn’t']].map(function(r){return '<button class="li" data-set="'+r[0]+'"><span class="grow"><b style="display:block;font-weight:600">'+r[1]+'</b><span class="small soft">'+esc(r[2])+'</span></span><span class="chev">›</span></button>';}).join('')+'<button class="li" data-set="reset"><span class="grow"><b style="display:block;font-weight:600;color:var(--rust)">Start over</b><span class="small soft">Delete everything on this device</span></span></button></div>'+(storageOK?'':'<p class="small bad">This browser is blocking storage, so your data will be lost when you close the page.</p>')};},
  backup:function(){return {title:'Back up your data',body:'<p class="small soft">Copy this text and keep it somewhere safe. On a new phone or computer, paste it here and tap Restore.</p><textarea id="bk" rows="6">'+esc(JSON.stringify(S))+'</textarea><div class="acts" style="margin-top:12px"><button class="btn" data-restore>Restore from text</button></div>'};},
  about:function(){return {title:'About Setu',body:'<p>Setu helps people who move from India to the UK. It shows how much money you have left each month, gives you a checklist for both countries, and helps you plan for a home and retirement in India.</p><p>It gives general guidance only. It is not financial, tax or immigration advice, and rules can change. Check the official websites, and talk to a qualified adviser before big decisions.</p><p class="small soft">Pay after tax uses 2026/27 tax rates for England, Wales and Northern Ireland. Scotland’s rates are a little different. Everything you enter stays on this device and is never sent anywhere.</p>'};}
};

/* ---------- events ---------- */
document.addEventListener('click',function(e){
  var t=e.target.closest&&e.target.closest('button,[data-bg],[data-monthin]');if(!t)return;
  if(t.hasAttribute('data-bg')){if(e.target===t)closeSheet();return;}
  if(t.hasAttribute('data-close')){closeSheet();return;}
  var d=t.dataset;
  if(d.funds){var g0=d.funds;openSheet(function(){return sheetFunds(g0);});return;}
  if(d.choose){var cc2=d.choose.split(':'),F0=FUNDS[cc2[1]];if(cc2[0]==='retire'){S.profile.retFund=cc2[1];S.profile.ret=F0.plan;}else{S.profile.homeFund=cc2[1];S.profile.homeRet=F0.plan;}save();buzz();sheetFn=null;render();toast('Plan updated for '+F0.name);return;}
  if(d.monthin){var mk=d.monthin;S.months=S.months||{};var cur0=S.months[mk]||{},exp0=takeHome(S.profile.salary,S.profile.pension).month;
    formSheet('Money in, '+mLabel(mk),[{k:'salary',label:'Salary credited this month (£). Leave empty to use your usual '+gbp(exp0)},{k:'carry',label:'Funds from previous month (£)'}],{salary:cur0.salary||'',carry:cur0.carry||''},function(o){S.months[mk]={salary:o.salary||0,carry:o.carry||0};});return;}
  if(d.wz){wizardAction(d.wz);return;}
  if(d.debt){var key=d.debt,meta=DEBTS.find(function(x){return x[0]===key;}),obj=wz.d.debts[key];
    var F=key==='card'?[{k:'bal',label:'How much you still owe on your cards (₹)'},{k:'emi',label:'How much you pay each month (₹)'}]:[{k:'bal',label:'How much is left to pay (₹)'},{k:'emi',label:'Monthly EMI (₹)'}];
    formDelete=function(){obj.bal=0;obj.emi=0;};
    formSheet(meta[1],F,{bal:obj.bal||'',emi:obj.emi||''},function(o){obj.bal=o.bal||0;obj.emi=o.emi||0;},((+obj.bal||0)+(+obj.emi||0)>0?'<button class="btn warn" data-form="delete">Remove</button>':''));return;}
  if(d.seg){wz.d[d.seg]=d.v;render();return;}
  if(d.go){var g=d.go.split(':');if(g[0]==='tab'){tab=g[1];render();}else if(g[0]==='plan'){var pi=+g[1],pl=split(),ix=pl.findIndex(function(x){return x.title===(pi===0?'Emergency savings':'Clear the credit card');});if(ix<0)ix=0;openSheet(function(){return SHEETS.plan(ix);});}else if(g[0]==='task'){var tid=g[1];openSheet(function(){return SHEETS.task(tid);});}else if(g[0]==='set'&&g[1]==='setup'){startWizard();}return;}
  if(d.tab){tab=d.tab;try{sessionStorage.setItem('setu-tab',tab);}catch(err){}render();var m=document.getElementById('main');if(m)m.scrollTop=0;return;}
  if(d.plan!=null){var i=d.plan==='debt'?'debt':+d.plan;openSheet(function(){return SHEETS.plan(i);});return;}
  if(d.phase){phase=d.phase;render();return;}
  if(d.task){var id=d.task;openSheet(function(){return SHEETS.task(id);});return;}
  if(d.tick){var k=d.tick;S.checks[k]=!S.checks[k];if(!S.checks[k])delete S.checks[k];save();var t0=TASKS.find(function(x){return x.id===k;});lastTicked=k;buzz();
    if(S.checks[k]){var phT=TASKS.filter(function(x){return x.ph===t0.ph;});if(doneCount(phT)===phT.length||doneCount(TASKS)===TASKS.length)setTimeout(confetti,120);}
    if(t.hasAttribute('data-close-after'))sheetFn=null;render();if(S.checks[k])toast(doneCount(TASKS)===TASKS.length?'All done. You’re settled in!':'Done: '+t0.title);return;}
  if(d.sheet){var n=d.sheet;if(n==='goals'){goalsSheet();return;}openSheet(function(){return SHEETS[n]();});return;}
  if(d.set){var s=d.set;
    if(s==='setup'){sheetFn=null;startWizard();return;}
    if(s==='fx'){toast('Checking the latest rate…');fetchFx(true).then(function(ok){render();toast(ok?'Rate updated: '+fxLabel().split(',')[0]:'Couldn’t reach the rate service. Using the last known rate.');});return;}
    if(s==='assume'){formSheet('How we do the maths',[{k:'inf',label:'How fast prices rise in India, % a year'},{k:'ret',label:'How fast investments grow, % a year'},{k:'wd',label:'How much of your savings you’d spend each year after retiring, % (3–3.5 is safe)'},{k:'efMonths',label:'How many months of costs to keep as emergency savings'}],S.profile,function(o){Object.assign(S.profile,o);});return;}
    if(s==='reset'){if(confirm('Delete everything you’ve added to Setu on this device? You can’t undo this.')){try{localStorage.removeItem(KEY);}catch(err){}S={v:1,profile:null,checks:{},items:[],cats:null};sheetFn=null;wz=null;phase=null;startWizard();}return;}
    openSheet(function(){return SHEETS[s]();});return;}
  if(d.form==='save'&&formSave){formSave();return;}
  if(d.form==='delete'&&formDelete){formDelete();save();closeSheet();return;}
  if(d.cat){addCat=d.cat;var a=document.getElementById('amt').value,nn=document.getElementById('note').value;render();document.getElementById('amt').value=a;document.getElementById('note').value=nn;return;}
  if(d.month){if(t.disabled)return;viewMonth=d.month;render();return;}
  if(t.hasAttribute('data-add')){var am=parseFloat(document.getElementById('amt').value);if(!(am>0)){document.getElementById('amt').focus();return;}
    var vm=viewMonth||mKey(),dt=vm===mKey()?today():vm+'-15';
    S.items.push({id:uid(),date:dt,cat:addCat,amt:Math.round(am*100)/100,note:document.getElementById('note').value.trim(),created:Date.now()});save();buzz();render();toast('Added '+gbp2(am));return;}
  if(d.undo){var u=d.undo;S.items=S.items.filter(function(x){return x.id!==u;});save();render();toast('Removed');return;}
  if(d.catEdit){var c=cats().find(function(x){return x.k===d.catEdit;});formSheet('Budget for '+c.label,[{k:'budget',label:'Budget each month (£)'}],c,function(o){c.budget=o.budget;});return;}
  if(d.item){var X=S.items.find(function(x){return x.id===d.item;});formDelete=function(){S.items=S.items.filter(function(y){return y!==X;});};
    formSheet('Edit spending',[{k:'note',label:'What was it?',text:true},{k:'cat',label:'Category',options:cats().map(function(c){return [c.k,c.label];})},{k:'amt',label:'Amount (£)'},{k:'date',label:'Date',text:true,date:true}],X,function(o){if(!/^\d{4}-\d{2}-\d{2}$/.test(o.date))o.date=X.date;Object.assign(X,o);},'<button class="btn warn" data-form="delete">Delete</button>');return;}
  if(t.hasAttribute('data-restore')){try{var o=JSON.parse(document.getElementById('bk').value);if(!o||o.v!==1||!o.profile)throw 0;S=o;save();sheetFn=null;wz=null;render();toast('Data restored');}catch(err){alert('That text isn’t a Setu backup. Copy the whole backup text and try again.');}return;}
});
function goalsSheet(){
  var p=S.profile;
  formSheet('Your goals',[{k:'retireAge',label:'Age you want to retire in India (0 to skip)'},{k:'retireSpend',label:'Money you’d need each month in India, in today’s ₹'},{k:'invested',label:'Invested for retirement so far (₹)'},{k:'homeOn',label:'Do you want to buy a home in India?',options:[['false','Not now'],['true','Yes']]},{k:'homeCost',label:'Home price today (₹)'},{k:'homeYear',label:'Buy in year'},{k:'homeSaved',label:'Saved for the home so far (₹)'}],Object.assign({},p,{homeOn:String(!!p.homeOn)}),function(o){o.homeOn=o.homeOn==='true';Object.assign(S.profile,o);});
}
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'&&sheetFn){closeSheet();return;}
  if((e.key==='Enter'||e.key===' ')&&e.target&&e.target.dataset&&e.target.dataset.monthin){e.preventDefault();e.target.click();return;}
  if(e.key==='Enter'&&e.target&&(e.target.id==='amt'||e.target.id==='note')){e.preventDefault();var b=document.querySelector('[data-add]');if(b)b.click();}
});
render();
fetchFx(false).then(function(ch){if(ch)render();});
fetchFxHist().then(function(ch){if(ch)render();});
})();
</script>
